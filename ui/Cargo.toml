[package]
name = "brot3-ui"
version.workspace = true
authors.workspace = true
default-run = "brot3"
edition.workspace = true
license.workspace = true
publish = false
description = "Interactive fractal explorer"

[[bin]]
name = "brot3"
test = false
doc = false
bench = false

[lib]
test = false
doc = false
doctest = false
bench = false

[features]
default = []
runtime-compilation = ["easy-shader-runner/runtime-compilation"]
hot-reload-shader = ["easy-shader-runner/hot-reload-shader"]

[dependencies]
anyhow = { workspace = true }
bytemuck = { workspace = true }
cfg-if = { workspace = true }
clap = { workspace = true, features = ["derive", "wrap_help"] }
egui_extras = { workspace = true, features = ["image"] }
glam = { workspace = true }
# image is indirectly used, for unpicking PNGs
image = { workspace = true, features = ["png"] }
log = { workspace = true }
mimalloc = { workspace = true }
num-traits = { workspace = true }
shader = { workspace = true }
shader_common = { workspace = true }
strum = { workspace = true, features = ["std"] }
util = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32")))'.dependencies]
easy-shader-runner = { workspace = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# CAUTION: wasm builds are not currently tested.
# wasm-bindgen-futures = "0.4.55"
easy-shader-runner = { workspace = true, default-features = false, features = ["emulate_constants"] }

[build-dependencies]
cfg_aliases = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "brot3"
default-features = false # no runtime compilation
section = "mathematics"
extended-description = """\
An interactive fractal explorer that uses the GPU.
"""
assets = [
  [
    "target/release/brot3",
    "usr/bin/",
    "755",
  ],

  [
    "../README.md",
    "usr/share/doc/brot3/",
    "644",
  ],
  [
    "../LICENSE",
    "usr/share/doc/brot3/",
    "644",
  ],
  [
    "../target/misc/changelog.md.gz",
    "usr/share/doc/brot3/",
    "644",
  ],
  [
    "../target/misc/changelog.Debian.gz",
    "usr/share/doc/brot3/",
    "644",
  ],
  [
    "../icons/128x128@2x.png",
    "usr/share/icons/brot3.png",
    "644",
  ],
  [
    "misc/brot3.desktop",
    "usr/share/applications/",
    "644",
  ],
]

[package.metadata.bundle.bin.brot3]
name = "brot3"
identifier = "com.crazyscot.brot3"
icon = ["icons/*"]
category = "GraphicsAndDesign"
# Don't forget to run cargo bundle --no-default-features ...
# N.B. README, etc, do not live in the bundle; they travel outboard as nobody ever looks inside the .app
