[package]
name = "shader"
description = "brot3's GPU shader"
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

# TODO: It would be nice to build dylib only on spirv and rlib on host builds.
# This is not currently supported by cargo; https://github.com/rust-lang/cargo/issues/12260 refers.
[lib]
crate-type = ["dylib", "rlib"]

[[bench]]
name = "shader"
harness = false

[[bench]]
name = "colour_conversion"
harness = false

[features]
## Emulate push constants. Useful if the GPU does not support PUSH_CONSTANTS.
emulate_constants = []

[dependencies]
const-default = { workspace = true }
spirv-std = { workspace = true }
shader_common = { workspace = true }
paste = { workspace = true }
float_eq = { workspace = true }
document-features = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
divan = { workspace = true }
glam = { workspace = true, default-features = false, features = ["std"] }
num-traits = { workspace = true }
pretty_assertions = { workspace = true }
strum = { workspace = true }
derive_more = { workspace = true, features = ["debug"] }
