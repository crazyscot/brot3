[package]
name = "shader"
description = "brot3's GPU shader"
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

# TODO: It would be nice to build dylib only on spirv and rlib on host builds.
# This is not currently supported by cargo; https://github.com/rust-lang/cargo/issues/12260 refers.
[lib]
crate-type = ["dylib", "rlib"]

[[bench]]
name = "shader"
harness = false

[[bench]]
name = "colour_conversion"
harness = false

[features]
## Emulate push constants. Useful if the GPU does not support PUSH_CONSTANTS.
emulate_constants = []

[dependencies]
const-default = { workspace = true }
spirv-std = { workspace = true }
shader_common = { path = "../shader_common" }
paste = "1.0.15"
float_eq = { version = "1.0.1", default-features = false }
document-features = "0.2.12"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_arch, values("spirv"))',
    'cfg(coverage_nightly)',
] }

[dev-dependencies]
divan = "0.1.21"
glam = { workspace = true, default-features = false, features = ["std"] }
num-traits = { workspace = true }
pretty_assertions = { workspace = true }
strum = { version = "0.27.2", default-features = false }
derive_more = { version = "2.1.0", features = ["debug"] }
