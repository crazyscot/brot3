name: CI

on:
  push:
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: 1
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  BROT3_NIGHTLY_VERSION: nightly-2026-10-01

# N.B. github runners have `rustup set profile minimal` by default

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release_workflow: false

  cargo-deny:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # Prevent sudden announcement of a new advisory from failing ci:
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # 2.0.14
        with:
          command: check ${{ matrix.checks }}
          rust-version: stable
          # N.B. the cargo-deny-action container image installs 1.85.0 by default

  coverage:
    name: coverage (selected)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - uses: ./.github/actions/toolchain
        with:
          channel: ${{ env.BROT3_NIGHTLY_VERSION }}
          components: llvm-tools
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-llvm-cov
          checksum: true
      # 2025-10-26: a hot cache saves only around 15 seconds, this is not worthwhile at present
      #- uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mkdir -p target/coverage
      - name: Run selected package tests with coverage analysis
        run:
          # Note that we do NOT run +nightly here, as we installed an explicit nightly version above.
          cargo llvm-cov -p brot3-lib --all-features --doctests --lcov --output-path lcov.info --locked
      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov.info
          path: lcov.info
      - name: Send result to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          #files: lcov.info # not needed, it autodetects
          #verbose: true # not needed
          name: lcov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  checks:
    name: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # This job runs all its checks without stopping (unless cancelled)
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
      - uses: taiki-e/install-action@dfcb1ee29051d97c8d0f2d437199570008fd5612 # v2.65.15
        with:
          tool: typos,dprint,cargo-machete,cargo-shear
          checksum: true
      - run: cargo fmt --all -- --check
        if: ${{ !cancelled() }}
      - run: typos
        if: ${{ !cancelled() }}
      - run: dprint check --list-different
        # to fix: dprint fmt
        if: ${{ !cancelled() }}
      - run: dprint fmt --diff
        if: ${{ failure() }}
      - run: cargo +stable machete --with-metadata
        if: ${{ !cancelled() }}
      - run: cargo +stable shear --locked
        if: ${{ !cancelled() }}

  clippy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: clippy (no-default-features)
        run: cargo clippy --locked --no-deps --all-targets --no-default-features
      - name: clippy
        run: cargo clippy --locked --no-deps --all-targets
