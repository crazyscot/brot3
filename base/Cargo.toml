[package]
name = "base"
version.workspace = true
authors = ["Ross Younger <crazyscot@gmail.com>", "Abel <abel465@gmail.com>"]
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license = "MIT"
publish = false
repository.workspace = true
description = "Shared definitions and support code for brot3 (separate crate for efficient testing)"

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
const-default = { workspace = true }
float_eq.workspace = true
num-traits.workspace = true

[target.'cfg(target_arch = "spirv")'.dependencies]

[target.'cfg(not(target_arch = "spirv"))'.dependencies]
clap = { workspace = true, features = ["derive"] }
dashu-float = { workspace = true }
dashu = { workspace = true, features = ["serde"] }
glam = { workspace = true, features = ["std", "bytemuck"] }
num-derive = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
strum = { workspace = true, default-features = false, features = ["derive"] }

[dev-dependencies]
assert_matches = { workspace = true }
pretty_assertions = { workspace = true }
strum = { workspace = true }

[lints]
workspace = true
